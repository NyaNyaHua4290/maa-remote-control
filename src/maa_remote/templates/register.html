{% extends "base.html" %}
{% block title %}注册 · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>注册</h1>
  <p class="muted">用户名 3-32 位，密码至少 8 位</p>

  {% if error %}<div class="flash flash-err">{{ error }}</div>{% endif %}

  <form method="post" action="/register" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="username">用户名</label>
    <input id="username" name="username" type="text" value="{{ username or '' }}" autocomplete="username" required autofocus>

    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>

    <label for="password2">确认密码</label>
    <input id="password2" name="password2" type="password" autocomplete="new-password" required>

    <button type="submit" class="btn btn-primary btn-block">注册</button>
  </form>

  <p class="muted center">已有账号？<a href="/login">去登录</a></p>
</div>
{% endblock %}
