<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">{{ app_name }}</a>
    {% if user %}
    <nav class="nav">
      <a href="/">我的实例</a>
      <a href="/setup">配置指引</a>
      {% if user.is_admin %}<a href="/admin/users">用户管理</a>{% endif %}
      <form method="post" action="/logout" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="link-button">退出（{{ user.username }}）</button>
      </form>
    </nav>
    {% endif %}
  </header>

  <main class="container">
    {% if msg %}<div class="flash flash-ok">{{ msg }}</div>{% endif %}
    {% if err %}<div class="flash flash-err">{{ err }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>本项目由 AI 辅助生成，以 MIT 许可证开源；与 MAA 官方团队无隶属关系。</p>
    <p>v{{ app_version }}</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
